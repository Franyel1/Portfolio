<!doctype html>
<html lang="en-us">

<head>
    <meta charset="UTF-8">

    <!-- include the p5 core library using the CDN -->
    <!-- <script src="/projects/vendor/p5-1.11.min.js"></script> -->

    <!-- include the p5.js library from a local file -->
    <script src="js/p5.min.js"></script>

    <!-- include the A-Frame core library using the CDN -->
    <!-- <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script> -->

    <!-- include the A-Frame core library from a local file -->
    <script src="js/aframe.min.js"></script>

    <!-- AFrameP5 library -->
    <script src="/projects/vendor/aframep5-v2.3.js"></script>

    <!-- Your p5 Sketch -->
    <script src="sketch.js"></script>

    <!-- custom styles -->
    <style>
        body {
            padding: 0;
            margin: 0;
        }
    </style>
</head>

<body>

    <!-- container to hold our VR scene - make sure to give this element an ID of 'VRScene' -->
    <a-scene id="VRScene">

        <!--
		       The 'a-assets' container is used to load in any external artwork you may want to use as "textures" for your objects. Ensure that this element has an ID of 'VRAssets'

		       Textures can be loaded by creating a new 'img' tag inside of the 'a-assets' container.
		       When doing this you will need to make sure to give your textures a unique ID -
		       this will be used by p5 to create new objects.

		       Example:

               <a-assets id="VRAssets">
    		       <img id="ITEM_ID_GOES_HERE" src="images/gold_block.png">
               </a-assets>
		-->

        <a-assets id="VRAssets">
            <img id="grassTop" src="media/grassTop.png">
            <img id="sky" src="media/sky.jpg">
            <a-assets-item id="key" src="media/key.glb"></a-assets-item>
            <img id="cartoonGrass" src="media/cartoonGrass.png">
            <a-assets-item id="box" src="media/box.glb"></a-assets-item>
        </a-assets>

    </a-scene>

</body>

</html>
