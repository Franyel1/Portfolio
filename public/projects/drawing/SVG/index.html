<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>SVG Icons</title>
</head>
<body>
    <img id="paper1" src="media/paper.png">
    <img id="paper1" src="media/paper.png" style="height:40vh;filter: hue-rotate(-50deg);">
    <div id="container">

        <svg class="icon" id="ticket">
            <use href="cleanedIcons/sprite.svg#ticket"/>
        </svg>

        <svg class="icon" id="star">
            <use href="cleanedIcons/sprite.svg#star"/>
        </svg>

        <svg class="icon" id="clapperboard">
            <use href="cleanedIcons/sprite.svg#clapperboard"/>
        </svg>

        <svg class="icon" id="camera">
            <use href="cleanedIcons/sprite.svg#camera" />
        </svg>

        <svg class="icon" id="popcorn">
            <use href="cleanedIcons/sprite.svg#popcorn"/>
        </svg>

    </div>
    <img id="paper2" src="media/paper.png">
    <img id="paper2" src="media/paper.png" style="height:40vh;filter: hue-rotate(-50deg);">
    
    
</body>
</html>
